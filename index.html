<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #2c3e50; color: #ecf0f1; padding: 20px; text-align: center; }
        .container { width: 80%; margin: auto; padding: 20px; }
        .hero { background: #e8eaf6; padding: 100px 20px; text-align: center; margin-bottom: 20px; }
        .hero h1 { margin: 0; font-size: 2.5em; }
        .btn { display: inline-block; background: #3498db; color: #fff; padding: 10px 20px; text-decoration: none; margin-top: 10px; border-radius: 5px; }
        .features { display: flex; justify-content: space-around; flex-wrap: wrap; }
        .feature { background: #fff; padding: 20px; margin: 10px; border-radius: 8px; width: 30%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { text-align: center; padding: 20px; background: #2c3e50; color: #ecf0f1; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Landing Page</h1>
</header>

<div class="container">
    <div class="hero">
        <h2>We help you achieve more.</h2>
        <a href="#" class="btn">Get Started</a>
    </div>

    <div class="features">
        <div class="feature">
            <h3>Fast</h3>
            <p>Quick performance and speed.</p>
        </div>
        <div class="feature">
            <h3>Reliable</h3>
            <p>Uptime you can trust.</p>
        </div>
        <div class="feature">
            <h3>Supported</h3>
            <p>24/7 customer support.</p>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2025 My Company. All rights reserved.</p>
</footer>

</body>
</html>
