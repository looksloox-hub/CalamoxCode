<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe Store Hero Section</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; }
    /* Hero specific */
    .hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      background: url('https://images.unsplash.com/photo-1522452151607-59b8e6d4be1e?auto=format&fit=crop&w=1470&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 720px;
      padding: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #e53935;
      color: #fff;
      font-weight: 600;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #c5302c; }
    /* Responsive */
    @media (max-width: 640px) {
      .hero { height: 45vh; }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Step Into Style</h1>
      <p class="text-lg md:text-xl mb-6 max-auto">Discover the latest collections of premium footwear designed for comfort and confidence.</p>
      <a href="#collections" class="btn">
        Shop Collection
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- Optional placeholder for rest of page -->
  <main id="collections" class="py-12 bg-gray-50">
    <div class="max-w-6xl mx-auto px-4">
      <h2 class="text-3xl font-bold text-center mb-8">Featured Collections</h2>
      <!-- Grid would go here -->
    </div>
  </main>

</body>
</html>
